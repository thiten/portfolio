<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiago Tenorio - Portfólio</title>
    <!-- Importando fonte limpa para o menu (semelhante à da imagem) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Importando ícones para as redes sociais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #333;
            overflow-x: hidden; /* Evita rolagem horizontal devido às imagens */
        }

        /* Cabeçalho */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 30px 60px;
        }

        /* Logo (Nome do Autor) */
        .logo {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 2px;
            user-select: none;
        }

               /* Navegação */
        nav {
            display: flex;
            align-items: center;
            gap: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 10px;
            margin-left: auto;
        }

        nav a {
            text-decoration: none;
            color: #333;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffae7a;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            align-items: center;
          
        }

        .social-icons a {
            color: #C5F527; /* Azul claro dos ícones */
            font-size: 1.2rem;
        }

        .social-icons a:hover {
            color: #7aa0b5;
        }

        /* Área Principal (Ilustrações) */
        main {
            position: relative;
            width: 100%;
            height: calc(100vh - 120px); /* Altura restante da tela */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container para as ilustrações (substitua o background-color pela sua imagem) */
        .illustrations-container {
            position: relative;
            width: 80%;
            max-width: 1200px;
            height: 80%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }

        /* Estilo dos placeholders das imagens */
        .character {
            width: 45%;
            height: 80%;
            background-color: #f4f4f4;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 0.8rem;
            text-align: center;
            border-radius: 10px;
        }

      
        }

        /* Responsividade básica */
        @media (max-width: 900px) {
            header {
                flex-direction: column;
                align-items: center;
                gap: 20px;
                padding: 20px;
            }
            
            nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .illustrations-container {
                width: 90%;
                flex-direction: column;
                align-items: center;
                gap: 20px;
           


        }
    </style>
</head>
<body>

    <header>
      <img src="https://i.postimg.cc/RhL20MTC/Captura-de-tela-de-2026-08-24-20-21-00.png" style="width: 36%; height: auto; margin-top: -5px">

        <nav>
            <a href="#">Home</a>
            <a href="https://sites.google.com/view/thiten/books">Books</a>
            <a href="https://thiten.github.io/portfolio/editorial">Editorial</a>
            <a href="https://thiten.github.io/portfolio/contact">Contact</a>
            
            <div class="social-icons">
                <a href="#" aria-label="Behance"><i class="fab fa-behance"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>

          <a href="#" aria-label="Instagram"><i class="fab fa-linkedin" aria-hidden="true"></i></a>

            
              
              
               
            </div>
        </nav>
    </header>

    <main>
        
    <img src="https://i.postimg.cc/66MKrcXc/Captura-de-tela-de-2026-08-24-19-35-29.png"  style="width: 90%; height: auto;">

            <!-- Substitua o conteúdo dessas divs pelas suas imagens (ex: <img src="burro.png" style="width:100%">) -->
            
           
    </main>

</body>
</html>
