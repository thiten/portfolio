<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiago Tenorio - Portfólio</title>
    <!-- Importando fonte limpa para o menu (semelhante à da imagem) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Importando ícones para as redes sociais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
      <link rel="stylesheet" href="styles.css">
        /* Reset básico */
        * 
        a {
    text-decoration: none;
    color: inherit; /* Isso faz o link herdar a cor do texto ao redor, se quiser */
}
        
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #333;
            overflow-x: hidden; /* Evita rolagem horizontal devido às imagens */
        }

        /* Cabeçalho */
       /* Cabeçalho - Padrão para DESKTOP (barra horizontal) */
header {
    display: flex;
    justify-content: space-between; /* Logo na esquerda, menu na direita */
    align-items: flex-start;
    padding: 30px 60px;
}

header img {
    width: 150px;
    height: auto;
}

nav {
    display: flex;
    align-items: center;
    gap: 30px;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 10px;
}

nav a { text-decoration: none; color: #333; transition: color 0.3s; }
        nav a:hover { color: #ffae7a; }
        
/* Responsividade para Celulares e Tablets */
@media (max-width: 900px) {
    /* Cabeçalho - Centralizado APENAS no mobile/tablet */
    header {
        flex-direction: column; 
        align-items: center;    
        justify-content: center;
        padding: 20px;
        gap: 15px;
    }

    header img {
        width: 120px; 
    }

    nav {
        gap: 15px;
        font-size: 0.7rem;
        justify-content: center;
        flex-wrap: wrap; 
    }

    main {
        padding: 10px;
    }

    /* Aumenta a imagem principal em telas menores */
    main img {
        width: 100vw;       
        max-width: 100vw;   
    }
}
        .social-icons a {
            color: #C5F527; /* Azul claro dos ícones */
            font-size: 1.2rem;
        }

        .social-icons a:hover {
            color: #7aa0b5;
        }

        /* Área Principal (Ilustrações) */
        main {
            position: relative;
            width: 100%;
            height: calc(100vh - 120px); /* Altura restante da tela */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container para as ilustrações (substitua o background-color pela sua imagem) */
        .illustrations-container {
            position: relative;
            width: 80%;
            max-width: 1200px;
            height: 80%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }

        /* Estilo dos placeholders das imagens */
        .character {
            width: 45%;
            height: 80%;
            background-color: #f4f4f4;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 0.8rem;
            text-align: center;
            border-radius: 10px;
        }

      
        }

        /* Responsividade básica */
        @media (max-width: 900px) {
            header {
                flex-direction: column;
                align-items: center;
                gap: 20px;
                padding: 20px;
            }
            
            nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .illustrations-container {
                width: 90%;
                flex-direction: column;
                align-items: center;
                gap: 20px;
           


        }
   
    </style>
   <style>
    .imagem-scale {
        width: 300px;
        height: 200px;
        transform: scale(0.5);  /* Reduz para 50% */
        transform-origin: top left; /* Origem da transformação */
    }
    
    /* Ou com transição suave */
    .imagem-scale-hover {
        width: 300px;
        height: auto;
        transition: transform 0.3s ease;
    }
    
    .imagem-scale-hover:hover {
        transform: scale(0.8);  /* Reduz ao passar o mouse */
    }
</style>
    
</head>
<body>

    <header>
      <img src="https://i.postimg.cc/RhL20MTC/Captura-de-tela-de-2026-08-24-20-21-00.png" style="width: 36%; height: auto; margin-top: -5px">

        <nav>
            <a href="#">Home</a>
            <a href="https://thiten.github.io/portfolio/books">Books</a>
            <a href="https://thiten.github.io/portfolio/editorial">Editorial</a>
            <a href="https://thiten.github.io/portfolio/contact">Contact</a>
            
          <div class="social-icons">
                <a href="https://www.behance.net/thiago-tenrio" aria-label="Behance" target='about blank'><i class="fab fa-behance"></i></a>
                <a href="https://www.instagram.com/thiago.tenorio_" target="about blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.linkedin.com/in/thiten/" target="about blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
        </nav>
    </header>

    <main>
     
        
    <img src="imagens/saltpepper.jpg">
                  
           
    </main>

</body>
</html>
