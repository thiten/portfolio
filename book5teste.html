<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiago Tenorio - Portfólio</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ✅ CSS EXTERNO (correto!) -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* Reset e Fonte */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #fff; color: #333; }

        /* ================== CABEÇALHO ================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 30px 60px;
        }

        .logo img { width: 250px; height: auto; margin-top: -5px; }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 15px;
            margin-left: auto;
        }

        nav a { text-decoration: none; color: #333; transition: color 0.3s; }
        nav a:hover { color:#c7f14f; }

        .social-icons { display: flex; gap: 15px; align-items: center; margin-left: 20px; }
        .social-icons a { color: #C5F527; font-size: 1.2rem; }
        .social-icons a:hover { color: #7aa0b5; }

        /* ================== CORPO INTERNO ================== */
        .internal-body {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: 2rem;
            font-weight: 300;
            color: #8faf5d;
            margin-bottom: 5px;
        }

        .page-title h2 {
            font-size: 1.5rem;
            font-weight: 300;
            color: #b8c7e0;
        }

        .image-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .stack-item {
            width: 100%;
            text-align: center;
        }

        .stack-item img {
            width: 100%;
            max-width: 700px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .stack-item img:hover {
            transform: scale(1.02);
        }

        .image-caption {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #777;
            font-style: italic;
        }

        /* ================== LIGHTBOX OVERLAY ================== */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        /* Modo 1: Ajustado à tela (padrão) */
        .lightbox-overlay.fit-screen .lightbox-image {
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            cursor: zoom-in;
        }

        /* Modo 2: Tamanho real (com scroll) */
        .lightbox-overlay.full-size {
            overflow: auto;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 20px;
        }

        .lightbox-overlay.full-size .lightbox-image {
            max-width: none;
            max-height: none;
            width: auto;
            height: auto;
            cursor: zoom-out;
            margin: 0 auto;
            display: block;
        }

        .lightbox-image {
            transition: all 0.3s ease;
            border-radius: 4px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            user-select: none;
            -webkit-user-select: none;
        }

        /* Botões de navegação */
        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 50px;
            font-weight: bold;
            text-decoration: none;
            padding: 10px 20px;
            transition: all 0.2s;
            z-index: 2002;
            user-select: none;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            cursor: pointer;
        }

        .lightbox-nav:hover {
            color: #C5F527;
            background: rgba(0,0,0,0.6);
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-nav.prev {
            left: 15px;
        }

        .lightbox-nav.next {
            right: 15px;
        }

        .lightbox-nav.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* Botão fechar */
        .lightbox-close {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-decoration: none;
            line-height: 1;
            transition: transform 0.2s;
            z-index: 2002;
            cursor: pointer;
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            border-radius: 50%;
        }

        .lightbox-close:hover {
            transform: scale(1.2);
            color: #C5F527;
            background: rgba(0,0,0,0.6);
        }

        /* Contador de imagens */
        .lightbox-counter {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 2002;
        }

        /* Responsividade */
        @media (max-width: 900px) {
            header { flex-direction: column; align-items: center; }
            nav { flex-wrap: wrap; justify-content: center; gap: 15px; margin-left: 0; }
            .page-title h1 { font-size: 1.5rem; }
            .page-title h2 { font-size: 1.1rem; }
            .stack-item img { max-width: 100%; }
            
            .lightbox-nav { font-size: 35px; padding: 8px 12px; }
            .lightbox-nav.prev { left: 10px; }
            .lightbox-nav.next { right: 10px; }
            .lightbox-close { font-size: 30px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <!-- ================== CABEÇALHO ================== -->
     <header>
        <div class="logo">
            <img src="imagens/thiten.png" style="width: 50%; height: auto; margin-top: -5px">
        </div>
        <nav>
            <a href="https://thiten.github.io/portfolio/">Home</a>
            <a href="https://thiten.github.io/portfolio/books">Books</a>
            <a href="https://thiten.github.io/portfolio/editorial">Editorial</a>
            <a href="https://thiten.github.io/portfolio/contact">Contact</a>
            <div class="social-icons">
                <a href="https://www.behance.net/thiago-tenrio" aria-label="Behance" target="_blank"><i class="fab fa-behance"></i></a>
                <a href="https://www.instagram.com/thiago.tenorio_" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.linkedin.com/in/thiten/" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
        </nav>
    </header>

    <!-- ================== CORPO INTERNO ================== -->
    <main class="internal-body">
        
        <div class="page-title">
            <h1>The big tour</h1>
            <h2>O grande passeio</h2>
        </div>

        <div class="image-stack">
            
            <!-- Imagem 1 -->
            <div class="stack-item">
                <img src="imagens/book5.png" alt="Ilustração 1" onclick="openLightbox(0)" class="gallery-img" data-index="0">
            </div>

            <div class="stack-item">
                <img src="imagens/passeio5.jpg" alt="Ilustração 2" onclick="openLightbox(1)" class="gallery-img" data-index="1">
            </div>

            <div class="stack-item">
                <img src="imagens/passeio1.jpg" alt="Ilustração 3" onclick="openLightbox(2)" class="gallery-img" data-index="2">
            </div>

            <div class="stack-item">
                <img src="imagens/passeio2.jpg" alt="Ilustração 4" onclick="openLightbox(3)" class="gallery-img" data-index="3">
            </div>

            <div class="stack-item">
                <img src="imagens/passeio3.jpg" alt="Ilustração 5" onclick="openLightbox(4)" class="gallery-img" data-index="4">
            </div>

            <div class="stack-item">
                <img src="imagens/passeio4.jpg" alt="Ilustração 6" onclick="openLightbox(5)" class="gallery-img" data-index="5">
            </div>

        </div>
    </main>

    <!-- ================== LIGHTBOX ================== -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <div class="lightbox-close" onclick="closeLightbox()">&times;</div>
        
        <a href="javascript:void(0)" class="lightbox-nav prev" id="prevBtn" onclick="prevImage()">‹</a>
        <a href="javascript:void(0)" class="lightbox-nav next" id="nextBtn" onclick="nextImage()">›</a>
        
        <img src="" alt="Imagem ampliada" class="lightbox-image" id="lightboxImg" onclick="toggleFullSize()">
        
        <div class="lightbox-counter" id="lightboxCounter">1 / 6</div>
    </div>

    <script>
        // ================== CONFIGURAÇÃO ==================
        const images = [
            { src: 'imagens/book5.png', alt: 'Ilustração 1' },
            { src: 'imagens/passeio5.jpg', alt: 'Ilustração 2' },
            { src: 'imagens/passeio1.jpg', alt: 'Ilustração 3' },
            { src: 'imagens/passeio2.jpg', alt: 'Ilustração 4' },
            { src: 'imagens/passeio3.jpg', alt: 'Ilustração 5' },
            { src: 'imagens/passeio4.jpg', alt: 'Ilustração 6' }
        ];

        let currentIndex = 0;
        let originalScrollY = 0;
        let isFullSize = false;

        const overlay = document.getElementById('lightboxOverlay');
        const lightboxImg = document.getElementById('lightboxImg');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('lightboxCounter');

        // ================== FUNÇÕES ==================

        // Abrir lightbox
        function openLightbox(index) {
            currentIndex = index;
            originalScrollY = window.scrollY;
            
            // Salva posição do scroll
            document.body.style.overflow = 'hidden';
            
            // Exibe overlay
            overlay.classList.add('active');
            overlay.classList.add('fit-screen');
            isFullSize = false;
            
            // Carrega imagem
            updateImage();
        }

        // Fechar lightbox
        function closeLightbox() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            
            // Restaura posição do scroll
            window.scrollTo(0, originalScrollY);
        }

        // Navegar para anterior
        function prevImage() {
            if (currentIndex > 0) {
                currentIndex--;
                updateImage();
            }
        }

        // Navegar para próxima
        function nextImage() {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                updateImage();
            }
        }

        // Atualizar imagem atual
        function updateImage() {
            const img = images[currentIndex];
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
            
            // Atualiza contador
            counter.textContent = `${currentIndex + 1} / ${images.length}`;
            
            // Atualiza botões de navegação
            prevBtn.classList.toggle('disabled', currentIndex === 0);
            nextBtn.classList.toggle('disabled', currentIndex === images.length - 1);
            
            // Reseta para modo fit-screen
            overlay.classList.add('fit-screen');
            overlay.classList.remove('full-size');
            isFullSize = false;
            lightboxImg.style.cursor = 'zoom-in';
        }

        // Alternar entre modo fit-screen e tamanho real
        function toggleFullSize() {
            if (isFullSize) {
                // Voltar para modo ajustado
                overlay.classList.add('fit-screen');
                overlay.classList.remove('full-size');
                isFullSize = false;
                lightboxImg.style.cursor = 'zoom-in';
            } else {
                // Mudar para tamanho real
                overlay.classList.remove('fit-screen');
                overlay.classList.add('full-size');
                isFullSize = true;
                lightboxImg.style.cursor = 'zoom-out';
            }
        }

        // ================== EVENTOS ==================

        // Força todos os links a abrirem na mesma aba
        document.addEventListener('click', function(event) {
            var link = event.target.closest('a');
            if (link && link.href.includes('sites.google.com')) {
                event.preventDefault(); 
                window.location.href = link.href; 
            }
        });

        // Teclado: ESC para fechar, setas para navegar
        document.addEventListener('keydown', function(e) {
            if (overlay.classList.contains('active')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'ArrowRight') nextImage();
            }
        });

        // Previne scroll da página quando lightbox está aberto (exceto no modo full-size)
        overlay.addEventListener('wheel', function(e) {
            if (!isFullSize) {
                e.preventDefault();
            }
        }, { passive: false });

        // Previne touch scroll quando lightbox está aberto (exceto no modo full-size)
        overlay.addEventListener('touchmove', function(e) {
            if (!isFullSize) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
    
    <footer>
        <div align="center">
            <a href="#" class="back-to-top">↑ Back to top</a>
            <p>thiten.illust@gmail.com</p>
        </div>
    </footer>
  
</body>
</html>
