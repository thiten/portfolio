<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiago Tenorio - Portfólio</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ✅ CSS EXTERNO (correto!) -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* Reset e Fonte */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #fff; color: #333; }

        /* ================== CABEÇALHO ================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 30px 60px;
        }

        .logo img { width: 250px; height: auto; margin-top: -5px; }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 15px;
            margin-left: auto;
        }

        nav a { text-decoration: none; color: #333; transition: color 0.3s; }
        nav a:hover { color: #ffae7a; }

        .social-icons { display: flex; gap: 15px; align-items: center; margin-left: 20px; }
        .social-icons a { color: #C5F527; font-size: 1.2rem; }
        .social-icons a:hover { color: #7aa0b5; }

        /* ================== CORPO INTERNO ================== */
        .internal-body {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: 2rem;
            font-weight: 300;
            color: #8faf5d;
            margin-bottom: 5px;
        }

        .page-title h2 {
            font-size: 1.5rem;
            font-weight: 300;
            color: #b8c7e0;
        }

        .image-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .stack-item {
            width: 100%;
            text-align: center;
        }

        .stack-item img {
            width: 100%;
            max-width: 700px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .image-caption {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #777;
            font-style: italic;
        }

        /* Responsividade */
        @media (max-width: 900px) {
            header { flex-direction: column; align-items: center; }
            nav { flex-wrap: wrap; justify-content: center; gap: 15px; margin-left: 0; }
            .page-title h1 { font-size: 1.5rem; }
            .page-title h2 { font-size: 1.1rem; }
            .stack-item img { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ================== CABEÇALHO ================== -->
       <header>
        <div class="logo">
            <img src="https://i.postimg.cc/RhL20MTC/Captura-de-tela-de-2026-08-24-20-21-00.png" alt="Thiago Tenorio">
        </div>
        <nav>
            <a href="https://thiten.github.io/portfolio/">Home</a>
            <a href="https://thiten.github.io/portfolio/books">Books</a>
            <a href="https://thiten.github.io/portfolio/editorial">Editorial</a>
            <a href="https://thiten.github.io/portfolio/contact">Contact</a>
            <div class="social-icons">
                <a href="https://www.behance.net/thiago-tenrio" aria-label="Behance" target="_blank"><i class="fab fa-behance"></i></a>
                <a href="https://www.instagram.com/thiago.tenorio_" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.linkedin.com/in/thiten/" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
        </nav>
    </header>

    <!-- ================== CORPO INTERNO ================== -->
    <main class="internal-body">
        
        <div class="page-title">
            <h1>In utero tribute</h1>
            <h2>tributo - In utero</h2>
        </div>

        <div class="image-stack">
            
            <!-- Imagem 1 -->
            <div class="stack-item">
                <img src="editorial/image(17).png" alt="Ilustração 1" width="500">
        

        </div>
    </main>

    <script>
        // Força todos os links a abrirem na mesma aba
        document.addEventListener('click', function(event) {
            var link = event.target.closest('a');
            if (link && link.href.includes('sites.google.com')) {
                event.preventDefault(); 
                window.location.href = link.href; 
            }
        });
    </script>
    
    <footer>
        <div align="center">
            <a href="#" class="back-to-top">↑ Back to top</a>
            <p>thiten.illust@gmail.com</p>
        </div>
    </footer>
  
</body>
</html>
