    <style>
   <link rel="stylesheet" href="styles.css">
        
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #fff; color: #333; }

        header {
    display: flex;
    justify-content: space-between; /* Logo na esquerda, menu na direita */
    align-items: flex-start;
    padding: 30px 60px;
}

header img {
    width: 150px;
    height: auto;
}


      .social-icons a {
    color: #C5F527 !important; /* Mantém a cor verde */
    font-size: 1.2rem;         /* Aumenta o tamanho dos ícones (ex: 1.8rem é bem maior) */
    transition: color 0.3s;    /* Mantém a transição suave */
}
      
nav {
    display: flex;
    align-items: center;
    gap: 30px;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 10px;
}

nav a { text-decoration: none; color: #333; transition: color 0.3s; }
        nav a:hover { color: #ffae7a; }
        
/* Responsividade para Celulares e Tablets */
@media (max-width: 900px) {
    /* Cabeçalho - Centralizado APENAS no mobile/tablet */
    header {
        flex-direction: column; 
        align-items: center;    
        justify-content: center;
        padding: 20px;
        gap: 15px;
    }

    header img {
        width: 120px; 
    }

    nav {
        gap: 15px;
        font-size: 0.7rem;
        justify-content: center;
        flex-wrap: wrap; 
    }

    main {
        padding: 10px;
    }

    /* Aumenta a imagem principal em telas menores */
    main img {
        width: 100vw;       
        max-width: 100vw;   
    }
}
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 320px;
            grid-auto-flow: row dense;
            gap: 0px;
            width: 100%;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 0;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img { transform: scale(1.05); }

        .gallery-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(197, 245, 39, 0.85));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 1;
            pointer-events: none;
        }

        .gallery-item:hover::before { opacity: 1; }

        /* LINK CLICÁVEL - Solução mais robusta */
        .gallery-link {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            cursor: pointer;
            display: block;
            text-decoration: none;
        }

        /* Informações */
        .gallery-info {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 2;
            width: 90%;
            pointer-events: none;
        }

        .gallery-item:hover .gallery-info { opacity: 1; }

        .gallery-info h3 { font-size: 1.3rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 5px; }
        .gallery-info p { font-size: 0.9rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9rem;
            color: #888;
            border-top: 1px solid #eee;
            width: 100%;
        }

        @media (max-width: 900px) {
            header { flex-direction: column; align-items: center; }
            nav { flex-wrap: wrap; justify-content: center; gap: 15px; margin-left: 0; }
            main { padding: 20px; }
            .gallery-grid { grid-auto-rows: 250px; }
        }

        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: auto;
            }
        }
    </style>
</head>
